name: Docker Build and Push

on:
  push:
    # branches: [main]
  workflow_call: # This allows the workflow to be triggered by other workflows in the repository. It enables you to create reusable workflows that can be called from multiple places, such as after a successful build or test workflow, to automate the process of building and pushing Docker images whenever certain conditions are met in your CI/CD pipeline.
  # workflow_dispatch: # This allows you to manually trigger the workflow from the GitHub Actions tab in your repository. It provides flexibility to build and push your Docker image whenever you want, without needing to push changes to the main branch.

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push to Docker Hub 
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/github-actions-demo:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/github-actions-demo:${{ github.ref_name }} 
            ${{ vars.DOCKERHUB_USERNAME }}/github-actions-demo:latest 