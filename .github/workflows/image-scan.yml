# Image-scan workflow is designed to scan the Docker images for vulnerabilities using Trivy. It is triggered on every push to the repository and can also be manually triggered using workflow_dispatch. The workflow runs on an Ubuntu environment and consists of steps to check out the code, set up Docker, install Trivy, and run the image scan to identify any known vulnerabilities in the Docker images used in the project.
# Trivy image scanner for CVE ->  DOcker images 
# Trivy Rating is like this -> 0 vulnerabilities found, 1 low, 2 medium, 3 high -> solution can be found , 4 critical -> 
name: Image Scan

on:
    workflow_call:

jobs:
    image-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Validate Dockerfile
              continue-on-error: true
              run: |
                if [ -f "Dockerfile" ]; then
                  echo "Dockerfile found, validating..."
                  docker run --rm -i hadolint/hadolint < Dockerfile
                else
                  echo "Dockerfile not found in root directory"
                fi

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            
            - name: Install Trivy Scanner
              uses: aquasecurity/trivy-action@v0.33.1 # This action installs the Trivy vulnerability scanner in the workflow environment. Trivy is a tool that scans Docker images for known vulnerabilities and security issues. By using this action, you can ensure that Trivy is available for use in subsequent steps of your workflow, allowing you to perform image scans effectively.
              with:
               severity: 'CRITICAL'
               exit-code: '1'
